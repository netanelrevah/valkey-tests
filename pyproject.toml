[project]
name = "nrevah-valkey-tests"
version = "0.1.0"
description = "Valkey Tcl test suite ported to Python"
readme = "README.md"
authors = [
    { name = "Netanel Revah" },
]
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3.4",
    "nrevah-pytcl",
    "nrevah-parametrization",
    "typer>=0.15.1",
]

[tool.uv.build-backend]
module-name = "valkey_tests_generator"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nrevah-pytcl = { path = "../pytcl", editable = true }
nrevah-parametrization = { path = "../parametrization", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.9.6",
    "ty>=0.0.1a7",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

lint.select = [
    "ANN",
    "E",
    "F",
    "FA",
    "FURB",
    "I",
    "N",
    "PGH",
    "PERF",
    "PL",
    "RUF",
    "UP",
    "YTT",
    "TC",
]
lint.ignore = [
    "E731",
    "RUF009",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["ANN", "PLR2004", "PLR0913", "E501"]
"valkey_tests/**" = ["E501", "F821", "N816"]
"valkey_tests_generator/**" = ["PLR2004"]

[[tool.ty.overrides]]
include = ["valkey_tests/**"]
rules.unresolved-reference = "ignore"